name: Build app

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --name "RAG Assistant" --noconfirm --windowed --collect-all chromadb --collect-data customtkinter app.py

      - name: Zip the Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/RAG Assistant" -DestinationPath "RAG-Assistant-Windows.zip"

      - name: Zip the Mac build
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/RAG Assistant.app" "RAG-Assistant-Mac.zip"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: RAG-Assistant-${{ runner.os }}
          path: RAG-Assistant-*.zip